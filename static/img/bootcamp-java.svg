    <!-- Portada de bootcamp — sistema de halo cromatico de marca, el mismo del
         portafolio: cada chip toma el matiz de su propio logotipo en version clara,
         con anillo y halo del mismo matiz. Sin blanco y sin colores ajenos a la paleta.
         Lienzo 1000x400. Todo el contenido vive dentro de la zona segura x 100..900
         para sobrevivir al recorte de bg-cover en tarjetas estrechas. -->
