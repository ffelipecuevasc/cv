<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"
     role="img" aria-label="Bootcamp Fundamentos de Ingeniería de Datos: Python y AWS"
     font-family="Lexend, 'Segoe UI', system-ui, sans-serif">
    <title>Bootcamp Fundamentos de Ingeniería de Datos: Python y AWS</title>
    <!-- Portada de bootcamp — lienzo 1000x400. Fondo, tipografia y conectores usan
         la paleta de marca (primary #007EA7, orient-950 #00131D, orient-200 #5DC9FF,
         primary-vibrant #00B0E8); cada tarjeta conserva el matiz de su propio
         logotipo en version aclarada, el mismo sistema de halo cromatico del sitio.
         Todo el contenido vive dentro de la zona segura x 170..830 / y 62..334 para
         sobrevivir al recorte de bg-cover en tarjetas de cualquier proporcion. -->
    <defs>
        <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#007EA7"/>
            <stop offset="1" stop-color="#00131D"/>
        </linearGradient>
        <radialGradient id="resplandor" cx="0.5" cy="0.42" r="0.62">
            <stop offset="0" stop-color="#00B0E8" stop-opacity="0.30"/>
            <stop offset="1" stop-color="#00B0E8" stop-opacity="0"/>
        </radialGradient>
        <pattern id="malla" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0H0v40" fill="none" stroke="#5DC9FF" stroke-opacity="0.10" stroke-width="1"/>
        </pattern>
        <linearGradient id="cristal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5DC9FF" stop-opacity="0.16"/>
            <stop offset="1" stop-color="#5DC9FF" stop-opacity="0.02"/>
        </linearGradient>
        <filter id="sombra-nodo" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00131D" flood-opacity="0.6"/>
        </filter>
        <radialGradient id="brillo-python" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#5393C6" stop-opacity="0.30"/>
            <stop offset="1" stop-color="#5393C6" stop-opacity="0"/>
        </radialGradient>
        <filter id="sombra-python" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#5393C6" flood-opacity="0.25"/>
        </filter>
        <radialGradient id="brillo-aws" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#F4A125" stop-opacity="0.30"/>
            <stop offset="1" stop-color="#F4A125" stop-opacity="0"/>
        </radialGradient>
        <filter id="sombra-aws" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F4A125" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- 1. Fondo de marca: degradado, malla y resplandor -->
    <rect width="1000" height="400" fill="url(#fondo)"/>
    <rect width="1000" height="400" fill="url(#malla)"/>
    <rect width="1000" height="400" fill="url(#resplandor)"/>

    <!-- 2. Llaves de codigo difuminadas y oleaje inferior -->
    <g aria-hidden="true">
        <text x="80" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="180" font-weight="700" fill="#5DC9FF" fill-opacity="0.05">{</text>
        <text x="850" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
              font-size="180" font-weight="700" fill="#5DC9FF" fill-opacity="0.05">}</text>
        <path d="M0 400 L0 330 C 250 300, 420 366, 620 336 C 800 310, 900 340, 1000 322 L1000 400 Z"
              fill="#00131D" fill-opacity="0.55"/>
        <path d="M0 400 L0 358 C 350 328, 650 400, 1000 350 L1000 400 Z"
              fill="#00131D" fill-opacity="0.75"/>
    </g>

    <!-- 3. Halos cromaticos detras de cada tarjeta -->
    <g aria-hidden="true">
    <circle cx="330" cy="202" r="140" fill="url(#brillo-python)"/>
    <circle cx="670" cy="202" r="140" fill="url(#brillo-aws)"/>
    </g>

    <!-- 4. Volanta e insignia de tecnologias -->
    <g aria-hidden="true">
        <text x="500" y="72" text-anchor="middle" font-size="14" font-weight="700"
              letter-spacing="8" fill="#5DC9FF">INGENIERÍA DE DATOS</text>
        <rect x="430" y="84" width="139" height="26" rx="13"
              fill="#007EA7" fill-opacity="0.22" stroke="#5DC9FF" stroke-opacity="0.45"/>
        <text x="500" y="101" text-anchor="middle" font-size="11" font-weight="800"
              letter-spacing="2" fill="#E4F3FF">PYTHON &amp; AWS</text>
    </g>

    <!-- 5. Conector entre tecnologias -->
    <g aria-hidden="true">
    <line x1="330" y1="202" x2="670" y2="202" stroke="#5DC9FF" stroke-opacity="0.30"
          stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="500" cy="202" r="26" fill="#00131D" stroke="#5DC9FF" stroke-opacity="0.35"
            stroke-width="2" filter="url(#sombra-nodo)"/>
    <text x="500" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" font-weight="700" fill="#B9E2FF">&lt;/&gt;</text>
    </g>

    <!-- 6. Tarjetas de cristal con los logotipos oficiales -->
    <g aria-hidden="true">
    <g transform="translate(250 122)">
        <rect width="160" height="160" rx="36" fill="#00131D" fill-opacity="0.55"/>
        <rect width="160" height="160" rx="36" fill="url(#cristal)"
              stroke="#5393C6" stroke-opacity="0.5" stroke-width="1.5" filter="url(#sombra-python)"/>
        <path d="M50 0h60" stroke="#5393C6" stroke-width="4" stroke-linecap="round"/>
        <g transform="translate(35.83 36.0) scale(0.3451)"><defs><linearGradient id="grad-python-1" x1="12.959%" x2="79.639%" y1="12.039%" y2="78.201%"><stop offset="0%" stop-color="#387eb8"/><stop offset="100%" stop-color="#366994"/></linearGradient><linearGradient id="grad-python-2" x1="19.128%" x2="90.742%" y1="20.579%" y2="88.429%"><stop offset="0%" stop-color="#ffe052"/><stop offset="100%" stop-color="#ffc331"/></linearGradient></defs><path fill="url(#grad-python-1)" d="M126.916.072c-64.832 0-60.784 28.115-60.784 28.115l.072 29.128h61.868v8.745H41.631S.145 61.355.145 126.77c0 65.417 36.21 63.097 36.21 63.097h21.61v-30.356s-1.165-36.21 35.632-36.21h61.362s34.475.557 34.475-33.319V33.97S194.67.072 126.916.072M92.802 19.66a11.12 11.12 0 0 1 11.13 11.13a11.12 11.12 0 0 1-11.13 11.13a11.12 11.12 0 0 1-11.13-11.13a11.12 11.12 0 0 1 11.13-11.13"/><path fill="url(#grad-python-2)" d="M128.757 254.126c64.832 0 60.784-28.115 60.784-28.115l-.072-29.127H127.6v-8.745h86.441s41.486 4.705 41.486-60.712c0-65.416-36.21-63.096-36.21-63.096h-21.61v30.355s1.165 36.21-35.632 36.21h-61.362s-34.475-.557-34.475 33.32v56.013s-5.235 33.897 62.518 33.897m34.114-19.586a11.12 11.12 0 0 1-11.13-11.13a11.12 11.12 0 0 1 11.13-11.131a11.12 11.12 0 0 1 11.13 11.13a11.12 11.12 0 0 1-11.13 11.13"/></g>
    </g>
    <g transform="translate(590 122)">
        <rect width="160" height="160" rx="36" fill="#00131D" fill-opacity="0.55"/>
        <rect width="160" height="160" rx="36" fill="url(#cristal)"
              stroke="#F4A125" stroke-opacity="0.5" stroke-width="1.5" filter="url(#sombra-aws)"/>
        <path d="M50 0h60" stroke="#F4A125" stroke-width="4" stroke-linecap="round"/>
        <g transform="translate(27.0 48.32) scale(0.4141)"><path fill="#C7D6E4" d="M72.392 55.438c0 3.137.34 5.68.933 7.545a45.4 45.4 0 0 0 2.712 6.103c.424.678.593 1.356.593 1.95c0 .847-.508 1.695-1.61 2.543l-5.34 3.56c-.763.509-1.526.763-2.205.763c-.847 0-1.695-.424-2.543-1.187a26 26 0 0 1-3.051-3.984c-.848-1.44-1.696-3.052-2.628-5.001q-9.919 11.697-24.922 11.698c-7.12 0-12.8-2.035-16.954-6.103c-4.153-4.07-6.272-9.495-6.272-16.276c0-7.205 2.543-13.054 7.714-17.462c5.17-4.408 12.037-6.612 20.768-6.612c2.882 0 5.849.254 8.985.678c3.137.424 6.358 1.102 9.749 1.865V29.33c0-6.443-1.357-10.935-3.985-13.563c-2.712-2.628-7.29-3.9-13.817-3.9c-2.967 0-6.018.34-9.155 1.103s-6.188 1.695-9.155 2.882c-1.356.593-2.373.932-2.967 1.102s-1.017.254-1.356.254c-1.187 0-1.78-.848-1.78-2.628v-4.154c0-1.356.17-2.373.593-2.966c.424-.594 1.187-1.187 2.374-1.78q4.45-2.29 10.68-3.815C33.908.763 38.316.255 42.978.255c10.088 0 17.463 2.288 22.21 6.866c4.662 4.577 7.036 11.528 7.036 20.853v27.464zM37.976 68.323c2.798 0 5.68-.508 8.731-1.526c3.052-1.017 5.765-2.882 8.053-5.425c1.357-1.61 2.374-3.39 2.882-5.425c.509-2.034.848-4.493.848-7.375v-3.56a71 71 0 0 0-7.799-1.441a64 64 0 0 0-7.968-.509c-5.68 0-9.833 1.102-12.63 3.391s-4.154 5.51-4.154 9.748c0 3.984 1.017 6.951 3.136 8.986c2.035 2.119 5.002 3.136 8.901 3.136m68.069 9.155c-1.526 0-2.543-.254-3.221-.848c-.678-.508-1.272-1.695-1.78-3.305L81.124 7.799c-.51-1.696-.764-2.798-.764-3.391c0-1.356.678-2.12 2.035-2.12h8.307c1.61 0 2.713.255 3.306.848c.678.509 1.187 1.696 1.695 3.306l14.241 56.117l13.224-56.117c.424-1.695.933-2.797 1.61-3.306c.679-.508 1.866-.847 3.392-.847h6.781c1.61 0 2.713.254 3.39.847c.679.509 1.272 1.696 1.611 3.306l13.394 56.795L168.01 6.442c.508-1.695 1.102-2.797 1.695-3.306c.678-.508 1.78-.847 3.306-.847h7.883c1.357 0 2.12.678 2.12 2.119c0 .424-.085.848-.17 1.356s-.254 1.187-.593 2.12l-20.43 65.525q-.762 2.544-1.78 3.306c-.678.509-1.78.848-3.22.848h-7.29c-1.611 0-2.713-.254-3.392-.848c-.678-.593-1.271-1.695-1.61-3.39l-13.14-54.676l-13.054 54.59c-.423 1.696-.932 2.798-1.61 3.391c-.678.594-1.865.848-3.39.848zm108.927 2.289c-4.408 0-8.816-.509-13.054-1.526c-4.239-1.017-7.544-2.12-9.748-3.39c-1.357-.764-2.29-1.611-2.628-2.374a6 6 0 0 1-.509-2.374V65.78c0-1.78.678-2.628 1.95-2.628a4.8 4.8 0 0 1 1.526.255c.508.17 1.271.508 2.119.847a46 46 0 0 0 9.324 2.967a51 51 0 0 0 10.088 1.017c5.34 0 9.494-.932 12.376-2.797s4.408-4.577 4.408-8.053c0-2.373-.763-4.323-2.289-5.934s-4.408-3.051-8.561-4.408l-12.292-3.814c-6.188-1.95-10.765-4.832-13.563-8.647c-2.797-3.73-4.238-7.883-4.238-12.291q0-5.34 2.289-9.41c1.525-2.712 3.56-5.085 6.103-6.95c2.543-1.95 5.425-3.391 8.816-4.408c3.39-1.017 6.95-1.441 10.68-1.441c1.865 0 3.815.085 5.68.339c1.95.254 3.73.593 5.51.932c1.695.424 3.306.848 4.832 1.357q2.288.762 3.56 1.525c1.187.679 2.034 1.357 2.543 2.12q.763 1.017.763 2.797v3.984c0 1.78-.678 2.713-1.95 2.713c-.678 0-1.78-.34-3.22-1.018q-7.25-3.306-16.276-3.306c-4.832 0-8.647.763-11.275 2.374c-2.627 1.61-3.984 4.069-3.984 7.544c0 2.374.848 4.408 2.543 6.019s4.832 3.221 9.325 4.662l12.037 3.815c6.103 1.95 10.511 4.662 13.139 8.137s3.9 7.46 3.9 11.868c0 3.645-.764 6.951-2.205 9.833c-1.525 2.882-3.56 5.425-6.188 7.46c-2.628 2.119-5.764 3.645-9.409 4.747c-3.815 1.187-7.799 1.78-12.122 1.78"/><path fill="#f90" d="M230.993 120.964c-27.888 20.599-68.408 31.534-103.247 31.534c-48.827 0-92.821-18.056-126.05-48.064c-2.628-2.373-.255-5.594 2.881-3.73c35.942 20.854 80.276 33.484 126.136 33.484c30.94 0 64.932-6.442 96.212-19.666c4.662-2.12 8.646 3.052 4.068 6.442m11.614-13.224c-3.56-4.577-23.566-2.204-32.636-1.102c-2.713.34-3.137-2.034-.678-3.814c15.936-11.19 42.13-7.968 45.181-4.239c3.052 3.815-.848 30.008-15.767 42.554c-2.288 1.95-4.492.933-3.475-1.61c3.39-8.393 10.935-27.296 7.375-31.789"/></g>
    </g>
    </g>

    <!-- 7. Codigo del plan formativo -->
    <g aria-hidden="true">
        <line x1="390" y1="322" x2="435" y2="322" stroke="#5DC9FF" stroke-opacity="0.55" stroke-width="2"
              stroke-linecap="round"/>
        <text x="500" y="329" text-anchor="middle" font-size="22" font-weight="700"
              letter-spacing="6" fill="#B9E2FF" fill-opacity="0.9">PF1487</text>
        <line x1="565" y1="322" x2="610" y2="322" stroke="#5DC9FF" stroke-opacity="0.55" stroke-width="2"
              stroke-linecap="round"/>
    </g>

    <!-- 8. Particulas de fondo -->
    <g aria-hidden="true">
        <circle cx="180" cy="104" r="1.5" fill="#5DC9FF" fill-opacity="0.6"/>
        <circle cx="828" cy="118" r="2" fill="#00B0E8" fill-opacity="0.7"/>
        <circle cx="140" cy="252" r="1" fill="#B9E2FF" fill-opacity="0.35"/>
        <circle cx="864" cy="236" r="1.5" fill="#5DC9FF" fill-opacity="0.5"/>
    </g>
</svg>
