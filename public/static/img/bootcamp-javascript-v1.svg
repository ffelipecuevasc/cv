    </g>

    <!-- 7. Codigo del plan formativo -->
    <g aria-hidden="true">
        <line x1="390" y1="322" x2="435" y2="322" stroke="#5DC9FF" stroke-opacity="0.55" stroke-width="2"
              stroke-linecap="round"/>
        <text x="500" y="329" text-anchor="middle" font-size="22" font-weight="700"
              letter-spacing="6" fill="#B9E2FF" fill-opacity="0.9">PF1163</text>
        <line x1="565" y1="322" x2="610" y2="322" stroke="#5DC9FF" stroke-opacity="0.55" stroke-width="2"
              stroke-linecap="round"/>
    </g>

    <!-- 8. Particulas de fondo -->
    <g aria-hidden="true">
        <circle cx="180" cy="104" r="1.5" fill="#5DC9FF" fill-opacity="0.6"/>
        <circle cx="828" cy="118" r="2" fill="#00B0E8" fill-opacity="0.7"/>
        <circle cx="140" cy="252" r="1" fill="#B9E2FF" fill-opacity="0.35"/>
        <circle cx="864" cy="236" r="1.5" fill="#5DC9FF" fill-opacity="0.5"/>
